<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Striped Skins standalone viewer</title>
  </head>
  <body>
    <div id="app" style="width: 500px; height: 500px; background: gray"></div>
    <script type="module" src="/main.js"></script>

    <script>
      var onStripedLoaded = () => {
        const viewer = new StripedViewer({
          targetElement: "#app",
          viewerOptions: { defaultSkinUrl: "/steve_pony.png" },
        });
        viewer.attach();
      };
    </script>
  </body>
</html>
